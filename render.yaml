# Render Blueprint for the FitAI API (FastAPI).
# Render dashboard -> New -> Blueprint -> pick this repo.
# Values marked `sync: false` are prompted for during setup (never commit them).
services:
  - type: web
    name: fitai-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free instances can't use preDeployCommand, so migrations run on start
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-flash-lite-latest
      - key: AI_DAILY_LIMIT
        value: "40"
